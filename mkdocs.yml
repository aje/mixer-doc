site_name: Mixer Documentation
theme:
  name: material
  language: en
  logo: material/shaker
  favicon: assets/images/placeholder.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - i18n
extra_javascript:
  - javascripts/checklist.js
plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav:
            - 首页: index.md
            - 工厂工人:
                - 入门指南: initiation.md
                - 机器测试清单: machine_testing.md
            - 经理:
                - 概览: manager/manager.md
                - 商店: manager/stores.md
                - 机器: manager/machines.md
                - 配方: manager/recipes.md
                - 配方组合: manager/recipe_combinations.md
                - 配方定制: manager/recipe_customization.md
                - 配方原料: manager/recipe_ingredients.md
                - 定制项: manager/customizations.md
                - 原料: manager/ingredients.md
                - 用户: manager/users.md
                - 生产记录: manager/production_records.md
                - 统计: manager/statistics.md
            - 最终用户:
                - 入门指南: getting_started.md
                - 主屏幕仪表板: home_screen.md
                - 绑定原料到容器: binding_ingredients.md
                - 填充和初始化容器: filling_containers.md
                - 温度控制: temperature_control.md
                - 手动出料原料: manual_dispensing.md
                - 出料: dispensing_drink.md
                - 清洗: cleaning_procedure.md
nav:
  - Home: index.md
  - Factory Worker:
      - Initiation Process: initiation.md
      - Machine Testing Checklist: machine_testing.md
  - Manager:
      - Overview: manager/manager.md
      - Stores: manager/stores.md
      - Machines: manager/machines.md
      - Recipes: manager/recipes.md
      - Recipe Combinations: manager/recipe_combinations.md
      - Recipe Customization: manager/recipe_customization.md
      - Recipe Ingredients: manager/recipe_ingredients.md
      - Customizations: manager/customizations.md
      - Ingredients: manager/ingredients.md
      - Users: manager/users.md
      - Production Records: manager/production_records.md
      - Statistics: manager/statistics.md
  - End User:
      - Getting Started: getting_started.md
      - Home Screen Dashboard: home_screen.md
      - Binding and Unbinding Ingredients: binding_ingredients.md
      - Filling Containers: filling_containers.md
      - Temperature Control: temperature_control.md
      - Manual Ingredient Dispensing: manual_dispensing.md
      - Dispensing by Recipe: dispensing_drink.md
      - Cleaning: cleaning_procedure.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
